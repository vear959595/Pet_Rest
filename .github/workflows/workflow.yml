name: Build and deploy rest-api
on:
  push:
    branches-ignore:
      - master
      - main
  workflow_dispatch:
env:
  REGISTRY: veberav
  IMAGE_NAME: rest-api
run-name: Build docker image
jobs:
  Build-docker-image:
    runs-on: ubuntu-24.04
    environment: General
    steps:
      - uses: priyesh2609/sha-trim-action@v1.1.2
        with:
          sha-length: 7
          env-name: 'TRIMMED_SHA'

      - name: Checkout commit
        uses: actions/checkout@v7.0.0
        with:
          ref: "${{ github.sha }}"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TRIMMED_SHA }}

  deploy-dev:
    needs: Build-docker-image
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: Dev
    steps:
      - name: Execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            sudo mkdir -p /opt/rest-api 
            sudo chown ${{ secrets.USERNAME }}:${{ secrets.USERNAME }} /opt/rest-api
            sudo cat > /opt/rest-api/.env.dev <<EOF
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_USER=${{ secrets.DB_USER }}
            IMAGE_NAME=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TRIMMED_SHA }}
            EOF

#      - name: Deploy dev
#        run: |
#          docker compose --env-file .env.dev -f docker-compose-deploy.yaml